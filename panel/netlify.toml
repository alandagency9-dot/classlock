# Settings for Netlify. Vercel ignores this file.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # The public Supabase values are meant to be in the website code; do not fail the build on them.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"
